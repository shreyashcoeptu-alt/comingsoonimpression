<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 34" width="100%" height="34" preserveAspectRatio="none">
  <defs>
    <pattern id="sprocketPattern" width="20" height="34" patternUnits="userSpaceOnUse">
      <!-- Top Sprocket Hole -->
      <rect x="5" y="3.5" width="10" height="6" rx="1.5" fill="#D9A441" fill-opacity="0.85"/>
      <!-- Inner Frame Divider -->
      <line x1="20" y1="0" x2="20" y2="34" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.3"/>
      <!-- Bottom Sprocket Hole -->
      <rect x="5" y="24.5" width="10" height="6" rx="1.5" fill="#D9A441" fill-opacity="0.85"/>
    </pattern>
  </defs>
  <!-- Filmstrip 35mm Solid Body -->
  <rect x="0" y="0" width="100%" height="34" fill="#140407"/>
  <!-- Top and Bottom Gold Guide Rails -->
  <line x1="0" y1="1" x2="100%" y2="1" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.75"/>
  <line x1="0" y1="33" x2="100%" y2="33" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.75"/>
  <!-- Repeating Sprocket Tracks -->
  <rect x="0" y="0" width="100%" height="34" fill="url(#sprocketPattern)"/>
</svg>
