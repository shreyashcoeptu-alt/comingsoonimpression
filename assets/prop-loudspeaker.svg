<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="100%" height="100%" fill="none">
  <defs>
    <filter id="propGlowRight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <pattern id="halftoneSpeaker" x="0" y="0" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.5" fill="#180507"/>
    </pattern>
  </defs>

  <g filter="url(#propGlowRight)">
    <!-- Paper White Cutout Border / Sticker Backing -->
    <path d="M70,80 C95,55 140,50 180,60 L240,110 C270,135 285,175 270,215 C250,250 205,270 160,265 L100,240 C65,220 40,180 45,140 L50,105 Z" fill="#F4E8D0" stroke="#180507" stroke-width="4"/>

    <!-- Vintage Metal Loudspeaker Horn Cone -->
    <path d="M185,95 L115,160 L140,195 L220,135 Z" fill="#C5B79F" stroke="#111" stroke-width="3"/>
    <path d="M185,95 L115,160 L140,195 L220,135 Z" fill="url(#halftoneSpeaker)" opacity="0.85"/>

    <!-- Speaker Back Housing -->
    <path d="M190,90 C220,70 245,95 240,120 L220,135 L185,95 Z" fill="#222" stroke="#111" stroke-width="3"/>
    
    <!-- Speaker Front Bell Rim -->
    <ellipse cx="115" cy="180" rx="45" ry="65" fill="#2A080B" stroke="#180507" stroke-width="4" transform="rotate(35 115 180)"/>
    <ellipse cx="118" cy="180" rx="35" ry="52" fill="#E8DEC8" stroke="#111" stroke-width="2" transform="rotate(35 118 180)"/>
    <ellipse cx="120" cy="180" rx="20" ry="32" fill="#180507" transform="rotate(35 120 180)"/>
    <circle cx="120" cy="180" r="10" fill="#9C161D" stroke="#FBD34D" stroke-width="2"/>

    <!-- Sound Lightning Bursts in Golden Yellow -->
    <g transform="translate(-10, 0)">
      <!-- Lightning Bolt 1 (Top) -->
      <polygon points="85,110 55,90 65,115 35,100 70,140 60,120" fill="#FBD34D" stroke="#180507" stroke-width="2.5"/>
      <!-- Lightning Bolt 2 (Middle) -->
      <polygon points="65,170 25,160 45,185 10,180 50,210 40,190" fill="#FBD34D" stroke="#180507" stroke-width="2.5"/>
      <!-- Lightning Bolt 3 (Bottom) -->
      <polygon points="90,230 60,245 80,255 50,275 100,270 85,250" fill="#FBD34D" stroke="#180507" stroke-width="2.5"/>
    </g>
  </g>
</svg>
