<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="filmGradBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#282828" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#101010" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="tapeShadowBottom" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="-6" dy="-8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#tapeShadowBottom)">
    <!-- Broad 35mm Film Ribbon sweeping up from bottom-left corner -->
    <path d="M-50,460 C120,380 320,300 620,320 C760,330 840,380 950,480 L920,380 C810,280 710,210 570,200 C270,180 80,260 -80,340 Z" fill="url(#filmGradBottom)" stroke="#D4AF37" stroke-width="3"/>

    <!-- Bottom Rail Sprockets -->
    <path d="M-45,445 C125,365 325,285 625,305 C765,315 845,365 945,465" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="5" stroke-dasharray="8 12" fill="none"/>

    <!-- Top Rail Sprockets -->
    <path d="M-75,355 C75,275 265,195 565,215 C705,225 805,295 915,395" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="5" stroke-dasharray="8 12" fill="none"/>

    <!-- Dividers & Frames -->
    <path d="M-10,315 L15,405 M120,270 L145,360 M260,230 L285,320 M400,210 L425,300 M540,210 L560,300 M680,235 L700,325 M810,290 L830,380" stroke="#E5A823" stroke-width="3.5" stroke-opacity="0.8"/>

    <!-- Inner Cells -->
    <polygon points="5,310 105,275 130,350 30,385" fill="#0A0A0A" fill-opacity="0.6" stroke="#444" stroke-width="1.5"/>
    <polygon points="140,265 245,230 270,305 165,340" fill="#0A0A0A" fill-opacity="0.6" stroke="#444" stroke-width="1.5"/>
    <polygon points="280,225 385,208 410,285 305,305" fill="#0A0A0A" fill-opacity="0.6" stroke="#444" stroke-width="1.5"/>
    <polygon points="420,208 525,210 545,285 440,285" fill="#0A0A0A" fill-opacity="0.6" stroke="#444" stroke-width="1.5"/>
    <polygon points="560,212 665,235 685,310 580,288" fill="#0A0A0A" fill-opacity="0.6" stroke="#444" stroke-width="1.5"/>
    <polygon points="700,240 795,295 815,370 720,315" fill="#0A0A0A" fill-opacity="0.6" stroke="#444" stroke-width="1.5"/>
  </g>
</svg>
