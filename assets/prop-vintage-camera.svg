<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="100%" height="100%" fill="none">
  <defs>
    <filter id="cameraShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>
  <g filter="url(#cameraShadow)">
    <!-- Sticker White Backing -->
    <path d="M40,55 C40,35 65,20 85,20 C95,20 105,25 110,32 C115,25 125,20 135,20 C155,20 180,35 180,55 C190,58 200,68 200,80 L235,95 C248,100 248,120 235,125 L200,140 C195,155 185,165 170,168 L170,225 C170,235 150,235 150,225 L150,170 L115,170 L115,225 C115,235 95,235 95,225 L95,170 L75,170 C55,170 40,150 40,130 Z" fill="#F4E8D0" stroke="#180507" stroke-width="3.5"/>

    <!-- Dual Film Reel Canisters -->
    <circle cx="85" cy="55" r="30" fill="#222" stroke="#111" stroke-width="2.5"/>
    <circle cx="85" cy="55" r="22" fill="#141414" stroke="#FBD34D" stroke-width="1.5" stroke-dasharray="6 4"/>
    <circle cx="85" cy="55" r="8" fill="#FBD34D"/>

    <circle cx="135" cy="55" r="30" fill="#222" stroke="#111" stroke-width="2.5"/>
    <circle cx="135" cy="55" r="22" fill="#141414" stroke="#FBD34D" stroke-width="1.5" stroke-dasharray="6 4"/>
    <circle cx="135" cy="55" r="8" fill="#FBD34D"/>

    <!-- Camera Body Box -->
    <rect x="55" y="75" width="130" height="85" rx="8" fill="#1E0709" stroke="#111" stroke-width="3"/>
    <rect x="65" y="85" width="60" height="65" rx="4" fill="#2D0B0F" stroke="#FBD34D" stroke-width="1.5"/>
    <circle cx="95" cy="118" r="14" fill="#9C161D" stroke="#D4AF37" stroke-width="1.5"/>

    <!-- Matte Box & Lens Cone -->
    <polygon points="185,90 230,80 230,140 185,130" fill="#111" stroke="#FBD34D" stroke-width="2"/>
    <ellipse cx="230" cy="110" rx="8" ry="28" fill="#FBD34D" stroke="#111" stroke-width="2"/>
    <ellipse cx="228" cy="110" rx="4" ry="18" fill="#0A0A0A"/>

    <!-- Viewfinder on top -->
    <rect x="80" y="68" width="55" height="10" rx="3" fill="#333" stroke="#111" stroke-width="1.5"/>

    <!-- Tripod Legs -->
    <line x1="85" y1="165" x2="60" y2="245" stroke="#180507" stroke-width="5" stroke-linecap="round"/>
    <line x1="120" y1="165" x2="120" y2="248" stroke="#180507" stroke-width="5" stroke-linecap="round"/>
    <line x1="155" y1="165" x2="180" y2="245" stroke="#180507" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
