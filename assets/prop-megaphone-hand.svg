<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 320" width="100%" height="100%" fill="none">
  <defs>
    <filter id="propGlowLeft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <pattern id="halftoneMegaphone" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.8" fill="#141414"/>
    </pattern>
  </defs>

  <g filter="url(#propGlowLeft)">
    <!-- Paper White Cutout Border / Sticker Backing -->
    <path d="M45,210 C40,190 55,165 70,150 L140,105 L150,75 C155,60 170,45 190,45 L270,75 C295,85 305,110 300,140 L285,190 C275,220 250,240 220,240 L160,225 L130,245 C110,260 85,285 70,285 C55,285 45,260 45,210 Z" fill="#F4E8D0" stroke="#180507" stroke-width="4"/>

    <!-- Hand Holding Megaphone -->
    <path d="M50,220 C45,200 60,185 80,180 L120,180 C125,195 125,220 115,240 L85,270 C70,270 55,250 50,220 Z" fill="#C5B79F" stroke="#222" stroke-width="3"/>
    <path d="M75,185 C85,185 95,205 90,220 M90,185 C100,185 110,205 105,220 M105,188 C115,188 122,205 118,220" stroke="#222" stroke-width="2.5" fill="none"/>
    <path d="M50,220 L80,180 L120,240 Z" fill="url(#halftoneMegaphone)" opacity="0.8"/>

    <!-- Megaphone Cone Body -->
    <path d="M110,175 L220,110 L210,195 L115,190 Z" fill="#DDD0BC" stroke="#111" stroke-width="3"/>
    <path d="M110,175 L220,110 L210,195 L115,190 Z" fill="url(#halftoneMegaphone)" opacity="0.9"/>

    <!-- Megaphone Front Flare / Horn Bell -->
    <ellipse cx="230" cy="155" rx="35" ry="60" fill="#222" stroke="#180507" stroke-width="4" transform="rotate(-15 230 155)"/>
    <ellipse cx="225" cy="155" rx="25" ry="48" fill="#F4E8D0" stroke="#111" stroke-width="2" transform="rotate(-15 225 155)"/>
    <ellipse cx="220" cy="155" rx="14" ry="30" fill="#111" transform="rotate(-15 220 155)"/>

    <!-- Sound Burst Rays / Droplets in Golden Yellow -->
    <g transform="translate(10, 0)">
      <!-- Top Wave Droplet -->
      <path d="M255,100 C275,80 305,75 320,85 C325,92 315,105 295,110 C275,115 260,110 255,100 Z" fill="#FBD34D" stroke="#111" stroke-width="3"/>
      <!-- Middle Wave Droplet -->
      <path d="M275,145 C305,140 335,148 335,160 C335,172 305,175 275,170 C265,168 265,150 275,145 Z" fill="#FBD34D" stroke="#111" stroke-width="3"/>
      <!-- Bottom Wave Droplet -->
      <path d="M255,205 C270,215 295,225 315,220 C322,212 315,195 290,190 C270,185 255,195 255,205 Z" fill="#FBD34D" stroke="#111" stroke-width="3"/>
      
      <!-- Motion Spark Lines -->
      <path d="M280,70 L300,55 M305,125 L330,120 M295,235 L320,250" stroke="#FBD34D" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
